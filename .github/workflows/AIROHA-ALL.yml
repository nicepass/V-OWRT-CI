#CI项目
name: AIROHA-ALL

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        # 只保留 AN7581：手上仅有 Nokia XG-040G-MD 一台设备。
        # AN7583 的 Config 文件保留在 Config/AIROHA-AN7583.txt 备用，
        # 需要时把 AIROHA-AN7583 加回本列表即可（注意 an7583 无 KERNEL_SIZE 之外的
        # 平台差异，其 image/an7583.mk 仅 5 个设备）。
        CONFIG: [AIROHA-AN7581]
        SOURCE: [pbs05/ponwrt]
        BRANCH: [master]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: vantage
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      #本目标为 PON 光猫，目标 CPU 无硬件 AES 指令。momo / nikki（mihomo 系）
      #与 honk（eBPF 代理）都用 AEAD 加密，无 AES 加速时退化为纯软件实现，
      #性能不可接受且无实用价值，故只保留 homeproxy（sing-box）。
      #mini-diskmanager 按需求一并移除。
      #
      #为何走 WRT_PACKAGE 而不是写进 Config/AIROHA-AN7581.txt：
      #这些包在 GENERAL.txt 里是 =y，而 WRT-CORE.yml 用
      #  cat 目标Config GENERAL.txt >> .config
      #追加，同一符号后追加者胜 —— 写进目标 Config 会被 GENERAL.txt 覆盖，
      #并且会触发 Config 覆盖冲突检测直接 fail。
      #WRT_PACKAGE 由 Scripts/Settings.sh 在 cat 之后 echo 进 .config，
      #优先级最高且不参与冲突检测，是唯一正确的按目标裁剪通道。
      WRT_PACKAGE: |
        CONFIG_PACKAGE_luci-app-momo=n
        CONFIG_PACKAGE_luci-app-nikki=n
        CONFIG_PACKAGE_luci-app-honk=n
        CONFIG_PACKAGE_luci-app-mini-diskmanager=n
        ${{ inputs.PACKAGE }}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
